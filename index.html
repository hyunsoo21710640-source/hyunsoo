<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>점검수첩</title>
<meta name="theme-color" content="#0088ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="점검수첩">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <main id="main"></main>

  <button class="fab" id="fab" data-action="open-add-choice">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <div class="tab" data-path="/today" data-href="/today">
      <span class="tab-dot"></span>
      <span>오늘</span>
    </div>
    <div class="tab" data-path="/calendar" data-href="/calendar">
      <span class="tab-dot"></span>
      <span>캘린더</span>
    </div>
    <div class="tab" data-path="/sites" data-href="/sites">
      <span class="tab-dot"></span>
      <span>현장</span>
    </div>
    <div class="tab" data-path="/settings" data-href="/settings">
      <span class="tab-dot"></span>
      <span>설정</span>
    </div>
  </nav>
</div>

<div id="sheet-overlay" data-action="close-add-choice">
  <div class="sheet-group">
    <div class="sheet-item" data-action="add-choice-manual">직접 입력</div>
    <div class="sheet-item" data-action="add-choice-excel">엑셀로 자동 반영</div>
  </div>
  <div class="sheet-cancel" data-action="close-add-choice">취소</div>
</div>

<input type="file" id="file-input" accept=".xlsx,.xls" style="display:none">
<div id="toast"></div>

<script src="vendor/fflate.umd.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/db.js"></script>
<script src="js/excel.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
